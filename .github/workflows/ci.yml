# Continuous integration: every push and pull request runs the full quality gate.
# Actions are pinned to full commit SHAs (supply-chain hardening); the token is read-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check (source, tests and e2e)
        run: npm run type-check
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Unit, integration and component tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Repository size guard (< 10 MB)
        run: |
          size_kb=$(git count-objects -vH | awk '/size-pack/ {print $2}')
          echo "packed size: ${size_kb}"
          git count-objects -v | awk '/size-pack/ { if ($2 > 10240) { print "repository exceeds 10 MB"; exit 1 } }'
