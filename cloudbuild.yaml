# Cloud Build pipeline: build the container, push it to Artifact Registry, deploy it to
# Cloud Run in Mumbai (asia-south1, closest to Indian readers) and smoke-test /api/health.
#
# One-time setup (documented in the README):
#   gcloud artifacts repositories create sign-se-pehle --repository-format=docker --location=asia-south1
#   printf '%s' "$KEY" | gcloud secrets create gemini-api-key --data-file=-
substitutions:
  _REGION: asia-south1
  _SERVICE: sign-se-pehle
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/sign-se-pehle/app

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${BUILD_ID}', '-t', '${_IMAGE}:latest', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=3
      - --memory=512Mi
      - --timeout=120
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest

  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL=$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$${URL}/api/health")
        echo "GET $${URL}/api/health -> $${STATUS}"
        test "$${STATUS}" = "200"

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest
